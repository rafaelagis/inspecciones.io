<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspecciones de Factibilidad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; }
        #mapa { height: 100vh; width: 100%; }
        #leyenda {
            position: absolute; bottom: 30px; right: 10px; z-index: 1000;
            background: white; padding: 12px 16px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 13px; line-height: 1.8;
        }
        #leyenda h4 { margin-bottom: 6px; font-size: 13px; color: #333; }
        .leyenda-item { display: flex; align-items: center; gap: 8px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.3); flex-shrink: 0; }
        #filtros {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 12px 16px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 13px;
        }
        #filtros h4 { margin-bottom: 8px; color: #333; }
        #filtros label { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; cursor: pointer; }
        #contador {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: white; padding: 8px 14px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 13px; color: #444;
        }
    </style>
</head>
<body>
    <div id="mapa"></div>
    <div id="contador">Cargando inspecciones...</div>

    <div id="filtros">
        <h4>Filtrar por inspector</h4>
        <label><input type="checkbox" id="chk-maxi" checked> <span style="color:#1a6fb5">● Maxi</span></label>
        <label><input type="checkbox" id="chk-reinaldo" checked> <span style="color:#c0392b">● Reinaldo</span></label>
        <label><input type="checkbox" id="chk-guille" checked> <span style="color:#1C7341">● Guille</span></label>
    </div>

    <div id="leyenda">
        <h4>Inspector</h4>
        <div class="leyenda-item"><div class="dot" style="background:#2980b9"></div> Maxi</div>
        <div class="leyenda-item"><div class="dot" style="background:#e74c3c"></div> Reinaldo</div>
        <div class="leyenda-item"><div class="dot" style="background:#1C7341"></div> Guille</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <script>
    const CONFIG = {
        urlCatastro: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR818ZjL3LrLFIwrl20srepq4-rhlfYMedQGlt5upQg1y7MlS9DpBbll1wGhGZULMMEqZv_cBvwgsz3/pub?output=csv",
        urlInspecciones: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQOxfDO4sIW00dG2m44p4jiUx8dBWDCmnfEeFAeKepome4lpwLHtNLB3HINcSuzxPf1hopMWcR56XW9/pub?output=csv",
        vigenciaMeses: 4,
        centro: [-31.255, -61.49],
        zoom: 14
    };

    // Colores y normalización por inspector
    const INSPECTORES = {
        maxi:     { color: "#2980b9", label: "Maxi" },
        reinaldo: { color: "#e74c3c", label: "Reinaldo" },
        guille:   { color: "#1C7341", label: "Guille" }
    };

    function normalizarInspector(valor) {
        if (!valor) return null;
        const v = valor.trim().toLowerCase();
        if (v === "maxi")     return "maxi";
        if (v === "reinaldo") return "reinaldo";
        if (v === "guille")   return "guille";
        return null;
    }

    const mapa = L.map('mapa', { preferCanvas: true }).setView(CONFIG.centro, CONFIG.zoom);
    L.tileLayer(
        'https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/capabaseargenmap@EPSG%3A3857@png/{z}/{x}/{-y}.png',
        { attribution: 'Leaflet | IGN', minZoom: 3, maxZoom: 25 }
    ).addTo(mapa);

    const capas = {
        maxi:     L.layerGroup(),
        reinaldo: L.layerGroup(),
        guille:   L.layerGroup()
    };
    Object.values(capas).forEach(c => c.addTo(mapa));

    function parsearFecha(str) {
        if (!str) return null;
        str = str.trim();
        if (str.includes('/')) {
            const [d, m, a] = str.split('/');
            return new Date(+a, +m - 1, +d);
        }
        return new Date(str);
    }

    function formatFecha(fecha) {
        if (!fecha || isNaN(fecha)) return "S/D";
        return fecha.toLocaleDateString('es-AR');
    }

    function cargarDatos() {
        Papa.parse(CONFIG.urlCatastro, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(resCatastro) {
                const coordsMap = {};
                resCatastro.data.forEach(function(fila) {
                    const id = String(fila.catastro || "").trim();
                    const lat = parseFloat(fila.ycoord);
                    const lng = parseFloat(fila.xcoord);
                    if (id && !isNaN(lat) && !isNaN(lng)) coordsMap[id] = { lat, lng };
                });
                Papa.parse(CONFIG.urlInspecciones, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(resInsp) { dibujarInspecciones(resInsp.data, coordsMap); },
                    error: function(err) {
                        document.getElementById('contador').textContent = "Error al cargar inspecciones.";
                    }
                });
            },
            error: function() {
                document.getElementById('contador').textContent = "Error al cargar catastros.";
            }
        });
    }

    function dibujarInspecciones(inspecciones, coordsMap) {
        let total = 0, sinCoords = 0, sinInspector = 0;
        const conteo = { maxi: 0, reinaldo: 0, guille: 0 };
        Object.values(capas).forEach(c => c.clearLayers());

        inspecciones.forEach(function(insp) {
            const idCatastro = String(insp.catastro || "").trim();
            const coords = coordsMap[idCatastro];
            if (!coords) { sinCoords++; return; }

            const inspectorKey = normalizarInspector(insp.inspector);
            if (!inspectorKey) { sinInspector++; return; }

            const info = INSPECTORES[inspectorKey];
            total++;
            conteo[inspectorKey]++;

            const fechaEmision = parsearFecha(insp.fecha);
            const vencimiento = fechaEmision ? new Date(fechaEmision) : null;
            if (vencimiento) vencimiento.setMonth(vencimiento.getMonth() + CONFIG.vigenciaMeses);

            const popup = `
                <div style="font-size:13px; line-height:1.6; min-width:180px">
                <b>Inspector:</b> <span style="color:${info.color}; font-weight:bold">${info.label}</span><br>
                    <b style="font-size:14px">${insp.propietario || "S/D"}</b><br>
                    <span style="color:#666">${insp.plano || "S/D"}</span><br>
                    <hr style="margin:6px 0; border-color:#eee">
                    <b>Catastro:</b> ${idCatastro}<br>
                       <b>Unidad:</b> ${insp.unidad || "S/D"}<br>
                    <b>Escribanía:</b> ${insp.escribania || "S/D"}<br>
                    <b>Horario:</b> ${insp.horario || "S/D"}<br>
                      <b>Aforo:</b> ${insp.aforo || "S/D"}<br>
                      <b>Observaciones:</b> ${insp.observaciones || "S/D"}<br>
                </div>`;

            L.circleMarker([coords.lat, coords.lng], {
                radius: 7,
                fillColor: info.color,
                color: "#ffffff",
                weight: 1.5,
                fillOpacity: 0.9
            })
            .bindPopup(popup)
            .addTo(capas[inspectorKey]);
        });

        document.getElementById('contador').innerHTML =
            `<b>${total}</b> inspecciones —
             <span style="color:#1a6fb5">● ${conteo.maxi} Maxi</span> ·
             <span style="color:#c0392b">● ${conteo.reinaldo} Reinaldo</span> ·
             <span style="color:#27ae60">● ${conteo.guille} Guille</span>` +
            (sinCoords > 0 ? ` · <span style="color:#999">${sinCoords} sin coordenadas</span>` : "") +
            (sinInspector > 0 ? ` · <span style="color:#999">${sinInspector} sin inspector</span>` : "");
    }

    document.getElementById('chk-maxi').addEventListener('change', function() {
        this.checked ? capas.maxi.addTo(mapa) : mapa.removeLayer(capas.maxi);
    });
    document.getElementById('chk-reinaldo').addEventListener('change', function() {
        this.checked ? capas.reinaldo.addTo(mapa) : mapa.removeLayer(capas.reinaldo);
    });
    document.getElementById('chk-guille').addEventListener('change', function() {
        this.checked ? capas.guille.addTo(mapa) : mapa.removeLayer(capas.guille);
    });

    if (navigator.geolocation) {
        const puntoUsuario = L.circleMarker([0, 0], {
            radius: 9, fillColor: "#2196F3", color: "#ffffff", weight: 2.5, fillOpacity: 1
        }).bindPopup("Tu ubicación");
        const circuloPrecision = L.circle([0, 0], {
            color: "#2196F3", fillColor: "#2196F3", fillOpacity: 0.1, weight: 1
        });
        let primeraVez = true;
        navigator.geolocation.watchPosition(
            function(pos) {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                puntoUsuario.setLatLng([lat, lng]).addTo(mapa);
                circuloPrecision.setLatLng([lat, lng]).setRadius(pos.coords.accuracy).addTo(mapa);
                if (primeraVez) { mapa.setView([lat, lng], 17); primeraVez = false; }
            },
            function(err) { console.warn("Geolocalización no disponible:", err.message); },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
        );
        const btnUbicacion = L.control({ position: 'bottomleft' });
        btnUbicacion.onAdd = function() {
            const btn = L.DomUtil.create('button');
            btn.innerHTML = '📍';
            btn.title = 'Mi ubicación';
            btn.style.cssText = 'font-size:20px;padding:8px 12px;cursor:pointer;border-radius:8px;border:none;background:white;box-shadow:0 2px 6px rgba(0,0,0,0.3);margin-bottom:10px;';
            L.DomEvent.on(btn, 'click', function() {
                navigator.geolocation.getCurrentPosition(function(pos) {
                    mapa.setView([pos.coords.latitude, pos.coords.longitude], 17);
                });
            });
            return btn;
        };
        btnUbicacion.addTo(mapa);
    }

    cargarDatos();
    </script>
</body>
</html>
